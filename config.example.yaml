# Пример конфига book2audio. Все ключи необязательны: показаны значения по
# умолчанию. Без умолчания только translate.model и tts.args — они нужны
# этапам translate и synth.
#
#   book2audio init book.pdf --config config.yaml
#
# После init главный конфиг книги — work/<slug>/config.yaml.

source_lang: en            # язык книги
target_lang: ru            # язык перевода и озвучки
workdir: work              # где создаются рабочие папки книг

book:                      # теги аудиокниги; пусто — из метаданных PDF
  title: ""
  author: ""

extract:
  ocr_min_chars: 50        # страница, на которой меньше символов, распознаётся через OCR
  ocr_lang: ""             # код языка tesseract; пусто — выводится из source_lang (en → eng)
  ocr_dpi: 300
  ocr_workers: 4

chapters:
  heading_regex: '^(Chapter|Part|Глава|Часть)\s+\S+'
  heading_max_chars: 80    # заголовок — отдельная строка не длиннее этого
  toc_max_headings: 3      # страница, где совпадений больше, считается оглавлением
  fallback_pages: 20       # размер раздела, если заголовки не найдены

translate:
  backend: openai                       # OpenAI-совместимый API: локальный сервер или облако
  base_url: http://localhost:11434/v1   # Ollama; для облака — адрес его API
  model: ""                             # обязательно: имя модели на сервере
  api_key_env: B2A_API_KEY              # переменная окружения с ключом; локальным серверам ключ не нужен
  temperature: 0.2
  chunk_chars: 3500        # размер фрагмента перевода
  workers: 4
  max_retries: 5           # повторы при сбоях связи: 429, 5xx, таймаут

tts:
  backend: piper
  command: piper
  # Обязательно: аргументы запуска движка. {out} заменяется путём WAV-файла.
  # Текст сегмента подаётся на стандартный ввод одной строкой.
  args: ["--model", "voices/ru_RU-irina-medium.onnx", "--output_file", "{out}"]
  segment_chars: 1200      # абзац длиннее делится по предложениям
  workers: 2
  # Необязательно: внешняя команда, расставляющая ударения перед озвучкой.
  # Получает на стандартный ввод по одному сегменту в строке и должна вывести
  # столько же строк. Запускается один раз на все сегменты запуска.
  # Piper понимает знак ударения U+0301 после ударной гласной: «го́лоса».
  accent_command: ""
  accent_args: []

audio:
  format: m4b              # m4b — один файл с главами; mp3 — файл на главу
  bitrate: 64k
  paragraph_pause_ms: 400  # пауза между абзацами
