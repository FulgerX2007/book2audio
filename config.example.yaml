# Example book2audio config. Every key is optional: the values shown are the
# defaults. Only translate.model has no default; the translate stage needs it
# unless source_lang and target_lang are the same.
#
#   book2audio init book.pdf --config config.yaml
#
# After init the book's main config is work/<slug>/config.yaml.

source_lang: en            # language of the book
target_lang: ru            # language of the translation and the speech; the same as source_lang means no translation
workdir: work              # where the book working folders are created

book:                      # audiobook tags; empty means taken from the PDF metadata
  title: ""
  author: ""

extract:
  ocr_min_chars: 50        # a page with fewer characters goes through OCR
  ocr_lang: ""             # tesseract language code; empty means derived from source_lang (en → eng)
  ocr_dpi: 300
  ocr_workers: 4

chapters:
  heading_regex: '^(Chapter|Part|Глава|Часть)\s+\S+'
  heading_max_chars: 80    # a heading is a line of its own, no longer than this
  toc_max_headings: 3      # a page with more matches is treated as a table of contents
  fallback_pages: 20       # section size when no headings are found

translate:
  backend: openai                       # OpenAI-compatible API: a local server or a cloud one
  base_url: http://localhost:11434/v1   # Ollama; for a cloud service, the address of its API
  model: ""                             # required: the model name on the server
  api_key_env: B2A_API_KEY              # environment variable holding the key; local servers need none
  temperature: 0.2
  chunk_chars: 3500        # size of a translation chunk
  workers: 4
  max_retries: 5           # retries on transport failures: 429, 5xx, timeout
  # Optional: extra HTTP headers for every request, for a service that needs
  # more than the key. Example for an Anthropic key that is not tied to a workspace:
  #   headers:
  #     anthropic-workspace-id: wrkspc_...
  headers: {}

# Speech. Two backends:
#   piper  — the command runs for every segment: text on standard input,
#            WAV at the {out} path. Fits Piper and any similar engine.
#   silero — scripts/silero_tts.py: the model is loaded once per batch of
#            segments, and Silero places stress and homographs itself. Example:
#              backend: silero
#              command: /full/path/to/scripts/silero_tts.py
#              args: ["--speaker", "xenia"]
#              segment_chars: 800
tts:
  backend: piper
  command: piper
  # The engine arguments. {out} is replaced with the WAV path; the segment
  # text is given on standard input as one line. Example:
  #   args: ["--model", "voices/ru_RU-irina-medium.onnx", "--output_file", "{out}"]
  # Empty (piper only): a Piper voice is downloaded when it is missing and the
  # arguments are built from it.
  args: []
  # The Piper voice to download when args is empty, e.g. en_GB-alan-medium.
  # Empty: the default voice of target_lang (ru, en, de, fr, es).
  voice: ""
  voices_dir: ""           # where voices are kept; empty: ~/.cache/book2audio/voices
  voices_url: https://huggingface.co/rhasspy/piper-voices/resolve/main
  segment_chars: 1200      # a longer paragraph is split by sentences
  workers: 2
  # Optional: an external command that adds stress marks before speech.
  # It receives one segment per line on standard input and must print the same
  # number of lines. It runs once for all segments of a run.
  # Piper understands the stress mark U+0301 after the stressed vowel: «го́лоса».
  accent_command: ""
  accent_args: []

audio:
  format: m4b              # m4b is one file with chapters; mp3 is a file per chapter
  bitrate: 64k
  paragraph_pause_ms: 400  # pause between paragraphs
